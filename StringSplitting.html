
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Left Right Text Splitter</title>

<style>
body{
    margin:0;
    padding:30px;
    background:#000;
    color:#fff;
    font-family:Georgia, "Noto Serif Thai", serif;
}

.main-container{
    max-width:1100px;
    margin:0 auto;
}

label{
    display:block;
    color:#d6b15e;
    font-size:17px;
    font-weight:700;
    margin-bottom:8px;
}

textarea,
input,
select{
    width:100%;
    box-sizing:border-box;
    background:#111;
    color:#fff;
    border:1px solid #444;
    padding:12px;
    font-size:16px;
    line-height:1.5;
    border-radius:6px;
}

textarea{
    resize:vertical;
}

.input-section{
    margin-bottom:20px;
}

.settings{
    display:grid;
    grid-template-columns:1.2fr 1.2fr 1fr 1fr;
    gap:15px;
    background:#111;
    border:1px solid #333;
    padding:15px;
    border-radius:8px;
    margin-bottom:18px;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:25px;
}

button{
    padding:11px 18px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:700;
}

button:focus-visible,
textarea:focus-visible,
input:focus-visible,
select:focus-visible{
    outline:2px solid #d6b15e;
    outline-offset:2px;
}

button:active{
    transform:translateY(1px);
}

input:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.btn-main{
    background:#d6b15e;
    color:#000;
}

.btn-dark{
    background:#333;
    color:#fff;
    border:1px solid #555;
}

.output-container{
    display:grid;
    grid-template-columns:minmax(0, 1fr) minmax(0, 1fr);
    gap:25px;
    margin-bottom:25px;
}

.copy-under{
    margin-top:10px;
}

.preview-box{
    margin-top:20px;
}

.preview-title{
    text-align:center;
    color:#d6b15e;
    letter-spacing:3px;
    margin-bottom:25px;
    font-size:20px;
    font-weight:700;
}

.preview-grid{
    display:grid;
    grid-template-columns:minmax(0, 1fr) minmax(0, 1fr);
    gap:20px;
}

.preview-panel{
    background:#050505;
    border:1px solid #333;
    padding:28px;
    border-radius:8px;
    min-width:0;
}

.preview-subtitle{
    color:#aaa;
    text-align:center;
    font-size:13px;
    letter-spacing:1px;
    margin-bottom:22px;
}

.preview-row{
    display:grid;
    gap:24px;
    margin-bottom:11px;
    align-items:start;
}

.preview-left{
    text-align:right;
    color:#d6b15e;
    font-weight:700;
    font-size:18px;
    line-height:1.35;
    overflow-wrap:anywhere;
}

.preview-block-item{
    margin-bottom:20px;
}

.preview-block-item:last-child{
    margin-bottom:0;
}

.preview-block-left{
    color:#d6b15e;
    font-weight:700;
    font-size:18px;
    line-height:1.35;
    overflow-wrap:anywhere;
}

.preview-block-right{
    color:#fff;
    font-size:18px;
    line-height:1.35;
    margin-top:4px;
    overflow-wrap:anywhere;
}

.preview-right{
    text-align:left;
    color:#ffffff;
    font-weight:400;
    font-size:18px;
    line-height:1.35;
    overflow-wrap:anywhere;
}

.small-note{
    color:#aaa;
    font-size:13px;
    margin-top:6px;
}

.status{
    color:#d6b15e;
    margin-top:10px;
    font-size:14px;
    min-height:1.4em;
}

@media (max-width:980px){
    .settings{
        grid-template-columns:1fr 1fr;
    }

    .preview-grid{
        grid-template-columns:1fr;
    }
}

@media (max-width:640px){
    body{
        padding:18px;
    }

    .settings,
    .output-container{
        grid-template-columns:1fr;
    }

    .preview-panel{
        padding:20px;
    }
}
</style>
</head>

<body>

<div class="main-container">

    <div class="input-section">
        <label for="inputText">1. วางข้อความที่ต้องการแยกซ้าย — ขวา</label>

        <textarea id="inputText" style="height:240px;">Welcome & Greetings ............... Church Anniversary Committee
Opening Prayer .................... Associate Minister
Scripture Reading ................. Guest Minister
Praise & Worship .................. Praise Team
Special Musical Selection ......... Church Choir
Church History Presentation ....... Church Historian
Recognition & Appreciation ........ Anniversary Committee
Introduction of Guest Speaker ..... Master of Ceremonies
Anniversary Message ............... Guest Speaker
Offering .......................... Finance Ministry
Acknowledgements .................. Church Anniversary Committee
Closing Remarks ................... Senior Pastor
Benediction ....................... Senior Pastor
Recessional</textarea>

        <div class="small-note">
            Separator: แยกข้อความในบรรทัดเดียวกันด้วยตัวคั่น • Block: ใช้บรรทัดว่างแบ่งแต่ละรายการ
        </div>
    </div>

    <div class="settings">
        <div>
            <label for="modeInput">โหมดการแยก</label>
            <select id="modeInput" onchange="updateModeHelp(); renderProgram();">
                <option value="separator">Separator / AUTO</option>
                <option value="block">Block (หัวข้อ + รายละเอียด)</option>
            </select>
        </div>

        <div>
            <label for="separatorInput">ตัวคั่น Separator</label>
            <input id="separatorInput" value="AUTO">
        </div>

        <div>
            <label for="leftWidthInput">Left Width</label>
            <input id="leftWidthInput" value="45%" inputmode="decimal">
        </div>

        <div>
            <label for="rightWidthInput">Right Width</label>
            <input id="rightWidthInput" value="55%" inputmode="decimal">
        </div>
    </div>

    <div class="buttons">
        <button class="btn-main" onclick="renderProgram()">Generate</button>
        <button class="btn-dark" onclick="swapText()">Swap Left ↔ Right</button>
        <button class="btn-dark" onclick="copyAll()">Copy All</button>
        <button class="btn-dark" onclick="clearAll()">Clear</button>
    </div>

    <div class="output-container">

        <div>
            <label for="outputLeft">ผลลัพธ์ฝั่งซ้าย</label>

            <textarea
                id="outputLeft"
                style="height:260px;"
                readonly></textarea>

            <div class="copy-under">
                <button
                    class="btn-dark"
                    onclick="copyText('outputLeft')">
                    Copy Left
                </button>
            </div>
        </div>

        <div>
            <label for="outputRight">ผลลัพธ์ฝั่งขวา</label>

            <textarea
                id="outputRight"
                style="height:260px;"
                readonly></textarea>

            <div class="copy-under">
                <button
                    class="btn-dark"
                    onclick="copyText('outputRight')">
                    Copy Right
                </button>
            </div>
        </div>

    </div>

    <div class="preview-box">
        <div class="preview-title">PREVIEW</div>
        <div class="preview-grid">
            <div class="preview-panel">
                <div class="preview-subtitle">แบบที่ 1 — ซ้าย / ขวา</div>
                <div id="preview"></div>
            </div>

            <div class="preview-panel">
                <div class="preview-subtitle">แบบที่ 2 — หัวข้อ / รายละเอียด</div>
                <div id="previewBlock"></div>
            </div>
        </div>
    </div>

    <div id="status" class="status" role="status" aria-live="polite"></div>

</div>

<script>
function escapeHTML(text){
    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

let currentRows = [];

function parseWidthWeight(value){
    const match = String(value)
        .trim()
        .match(/^(\d+(?:\.\d+)?)\s*(?:%|fr)?$/i);

    if(!match) return null;

    const number = Number(match[1]);
    if(!Number.isFinite(number) || number <= 0 || number > 1000){
        return null;
    }

    return number;
}

function getColumnSettings(){
    const leftValue =
        document.getElementById("leftWidthInput").value;
    const rightValue =
        document.getElementById("rightWidthInput").value;

    const parsedLeft = parseWidthWeight(leftValue);
    const parsedRight = parseWidthWeight(rightValue);
    const corrected =
        parsedLeft === null || parsedRight === null;
    const left = corrected ? 45 : parsedLeft;
    const right = corrected ? 55 : parsedRight;

    return {
        template:
            "minmax(0, " + left + "fr) " +
            "minmax(0, " + right + "fr)",
        corrected: corrected
    };
}

function getSeparatorRegex(){
    const selected =
        document.getElementById("separatorInput")
        .value
        .trim();

    if(selected && selected.toUpperCase() !== "AUTO"){
        const escaped =
            selected.replace(/[-\/\\^$*+?.()|[\]{}]/g, "\\$&");

        return new RegExp("\\s*" + escaped + "\\s*");
    }

    return /\s*(?:\.{3,}|-{3,}|_{3,}|—|–|\||:|=|→|>>)\s*/;
}

function splitLineSmart(line){
    const selected =
        document.getElementById("separatorInput")
        .value
        .trim();

    if(selected && selected.toUpperCase() !== "AUTO"){
        const regex = getSeparatorRegex(line);
        return line.split(regex);
    }

    const dotLeaderRegex =
        /\s*(?:\.{3,}|-{3,}|_{3,})\s*/;

    if(dotLeaderRegex.test(line)){
        return line.split(dotLeaderRegex);
    }

    const normalRegex =
        /\s*(?:—|–|\||:|=|→|>>)\s*/;

    if(normalRegex.test(line)){
        return line.split(normalRegex);
    }

    return [line, ""];
}

function cleanText(text){
    return String(text)
        .trim()
        .replace(/^\*\*(.*?)\*\*$/s, "$1")
        .trim();
}

function parseBlockMode(rawText){
    return rawText
        .replace(/\r\n?/g, "\n")
        .trim()
        .split(/\n\s*\n+/)
        .map(function(block){
            const lines = block
                .split("\n")
                .map(cleanText)
                .filter(Boolean);

            return {
                left: lines[0] || "",
                right: lines.slice(1).join(" — ")
            };
        })
        .filter(function(item){
            return item.left || item.right;
        });
}

function renderProgram(){
    const rawText =
        document.getElementById("inputText")
        .value;

    const columnSettings = getColumnSettings();

    const mode =
        document.getElementById("modeInput").value;

    let rows = [];
    if(mode === "block"){
        rows = parseBlockMode(rawText);
    }else{
        rawText.split("\n").forEach(function(line){
            if(!line.trim()) return;

            const parts = splitLineSmart(line);
            rows.push({
                left: cleanText(parts.shift() || ""),
                right: cleanText(parts.join(" — "))
            });
        });
    }

    currentRows = rows.map(function(row){
        return {
            left: row.left,
            right: row.right
        };
    });

    let leftLines = [];
    let rightLines = [];
    let previewRows = "";
    let previewBlocks = "";

    rows.forEach(function(row){
        const leftText = row.left;
        const rightText = row.right;

        leftLines.push(leftText);
        rightLines.push(rightText);

        previewRows +=
            '<div class="preview-row" style="grid-template-columns:' +
            columnSettings.template +
            ';">' +
            '<div class="preview-left">' +
            escapeHTML(leftText) +
            '</div>' +
            '<div class="preview-right">' +
            escapeHTML(rightText) +
            '</div>' +
            '</div>';

        previewBlocks +=
            '<div class="preview-block-item">' +
            '<div class="preview-block-left">' +
            escapeHTML(leftText) +
            '</div>' +
            (rightText
                ? '<div class="preview-block-right">' +
                  escapeHTML(rightText) +
                  '</div>'
                : '') +
            '</div>';
    });

    document.getElementById("outputLeft").value =
        leftLines.join("\n");

    document.getElementById("outputRight").value =
        rightLines.join("\n");

    document.getElementById("preview").innerHTML =
        previewRows;

    document.getElementById("previewBlock").innerHTML =
        previewBlocks;

    if(!rows.length){
        setStatus("ไม่พบข้อความสำหรับแยก");
    }else{
        setStatus(
            "แยกข้อความสำเร็จ (" +
            (mode === "block" ? "Block" : "Separator") +
            ")" +
            (columnSettings.corrected
                ? " — ค่าความกว้างไม่ถูกต้อง จึงใช้ 45% / 55%"
                : "")
        );
    }
}

function updateModeHelp(){
    const blockMode =
        document.getElementById("modeInput").value === "block";

    document.getElementById("separatorInput").disabled = blockMode;
    setStatus(blockMode
        ? "โหมด Block: บรรทัดแรกเป็นฝั่งซ้าย บรรทัดถัดไปเป็นฝั่งขวา และใช้บรรทัดว่างแบ่งรายการ"
        : "โหมด Separator: แยกข้อความด้วยตัวคั่นในแต่ละบรรทัด");
}

function swapText(){
    if(!currentRows.length){
        alert("กรุณากด Generate ก่อน");
        return;
    }

    const combined = currentRows.map(function(row){
        return row.right +
            " ............... " +
            row.left;
    });

    document.getElementById("inputText").value =
        combined.join("\n");

    document.getElementById("modeInput").value = "separator";
    document.getElementById("separatorInput").value = "AUTO";
    updateModeHelp();
    renderProgram();
}

function copyToClipboard(text){
    if(!text.trim()){
        alert("ไม่มีข้อความให้คัดลอก");
        return;
    }

    if(navigator.clipboard && window.isSecureContext){
        navigator.clipboard.writeText(text)
            .then(function(){
                setStatus("คัดลอกแล้ว");
            })
            .catch(function(){
                fallbackCopy(text);
            });
    }else{
        fallbackCopy(text);
    }
}

function fallbackCopy(text){
    const temp =
        document.createElement("textarea");

    temp.value = text;
    temp.setAttribute("readonly", "");
    temp.style.position = "fixed";
    temp.style.left = "-9999px";
    temp.style.top = "-9999px";
    temp.style.opacity = "0";

    document.body.appendChild(temp);

    temp.focus();
    temp.select();
    temp.setSelectionRange(0, temp.value.length);

    try{
        const success =
            document.execCommand("copy");

        if(success){
            setStatus("คัดลอกแล้ว");
        }else{
            alert("Copy ไม่สำเร็จ กรุณากด Ctrl + C เอง");
        }
    }catch(err){
        alert("Copy ไม่สำเร็จ กรุณากด Ctrl + C เอง");
    }

    document.body.removeChild(temp);
}

function copyText(elementId){
    const element =
        document.getElementById(elementId);

    const value =
        element.value || "";

    copyToClipboard(value);
}

function copyAll(){
    const left =
        document.getElementById("outputLeft")
        .value;

    const right =
        document.getElementById("outputRight")
        .value;

    if(!left.trim() && !right.trim()){
        alert("ไม่มีข้อความให้คัดลอก");
        return;
    }

    const allText =
        "LEFT:\n" +
        left +
        "\n\nRIGHT:\n" +
        right;

    copyToClipboard(allText);
}

function clearAll(){
    document.getElementById("inputText").value = "";
    document.getElementById("outputLeft").value = "";
    document.getElementById("outputRight").value = "";
    document.getElementById("preview").innerHTML = "";
    document.getElementById("previewBlock").innerHTML = "";
    currentRows = [];

    setStatus("ล้างข้อมูลแล้ว");
}

function setStatus(message){
    document.getElementById("status").textContent = message;
}

updateModeHelp();
renderProgram();
</script>

</body>
</html>
